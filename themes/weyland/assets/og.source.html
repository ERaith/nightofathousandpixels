<!DOCTYPE html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;padding:0}
 body{width:1200px;height:630px;overflow:hidden;background:#000;
   font-family:"Futura","Century Gothic","Avenir Next",ui-sans-serif,system-ui,sans-serif;color:#e6ebed}
 .wrap{position:relative;width:1200px;height:630px;box-sizing:border-box;
   background:
     radial-gradient(1200px 600px at 100% 0%, rgba(0,221,255,.13), transparent 60%) right top no-repeat,
     repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
     radial-gradient(420px 420px at 0% 100%, rgba(0,0,0,0) 0%, rgba(0,0,0,.5) 45%, rgba(0,0,0,.94) 100%),
     url("wy-stripes.svg") left bottom / 470px no-repeat,
     #000;
   display:flex;flex-direction:column;justify-content:center;padding:0 92px}
 .kicker{font-size:27px;letter-spacing:.34em;color:#00ddff;margin-bottom:30px;text-transform:uppercase}
 h1{font-size:96px;line-height:1.02;margin:0 0 28px;letter-spacing:-.005em;font-weight:700}
 .bar{width:150px;height:3px;background:#00ddff;margin:0 0 28px}
 p{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
   font-size:30px;line-height:1.45;color:#96a1a5;margin:0;max-width:780px}
 .corner{position:absolute;right:92px;top:62px;text-align:right;
   font-size:22px;letter-spacing:.3em;color:#96a1a5;text-transform:uppercase}
 .year{position:absolute;right:92px;bottom:56px;font-size:30px;letter-spacing:.5em;color:#00ddff}
</style></head><body><div class="wrap">
 <div class="corner">Weyland-Yutani Corp</div>
 <div class="kicker">Building Better Worlds</div>
 <h1>Night of a<br>Thousand Pixels</h1>
 <div class="bar"></div>
 <p>Thirty personnel, two allocations each, one title per cycle,<br>selected by ballot and recorded permanently.</p>
 <div class="year">2026</div>
</div></body></html>
