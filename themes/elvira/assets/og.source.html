<!DOCTYPE html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;padding:0}
 body{width:1200px;height:630px;overflow:hidden;background:#0d0711;
   font-family:Georgia,"Times New Roman",serif;color:#f4eefa}
 .wrap{position:relative;width:1200px;height:630px;
   background:
     radial-gradient(130% 85% at 50% 0%, rgba(224,166,255,.20), transparent 60%),
     radial-gradient(90% 60% at 92% 100%, rgba(255,95,168,.16), transparent 58%),
     repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 26px),
     #0d0711;
   display:flex;flex-direction:column;justify-content:center;align-items:center;
   text-align:center;padding:0 90px;box-sizing:border-box}
 .kicker{font-family:Georgia,serif;font-style:italic;font-size:30px;color:#ff5fa8;margin-bottom:22px;letter-spacing:.04em}
 h1{font-family:Didot,"Bodoni 72","Hoefler Text",Georgia,serif;
   font-size:104px;line-height:1.02;margin:0 0 26px;letter-spacing:.005em}
 .bar{width:140px;height:2px;background:#e0a6ff;margin:0 0 26px}
 p{font-size:31px;line-height:1.45;color:#bba9c9;margin:0;max-width:860px}
 .year{position:absolute;left:0;right:0;bottom:44px;font-family:Didot,"Bodoni 72",Georgia,serif;
   font-size:30px;letter-spacing:.5em;color:#e0a6ff}
</style></head><body><div class="wrap">
 <div class="kicker">A Thousand Pixels After Dark</div>
 <h1>Night of a<br>Thousand Pixels</h1>
 <div class="bar"></div>
 <p>Thirty friends, two picks each, one movie, and me.<br>Unpleasant dreams.</p>
 <div class="year">2026</div>
</div></body></html>
