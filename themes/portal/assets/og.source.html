<!DOCTYPE html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;padding:0}
 body{width:1200px;height:630px;overflow:hidden;background:#0b0d10;
   font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:#eef1f4}
 .wrap{position:relative;width:1200px;height:630px;
   background:
     radial-gradient(120% 80% at 50% 0%, rgba(255,159,74,.10), transparent 62%),
     repeating-linear-gradient(0deg, rgba(92,200,255,.05) 0 1px, transparent 1px 72px),
     repeating-linear-gradient(90deg, rgba(92,200,255,.05) 0 1px, transparent 1px 72px),
     #0b0d10;
   display:flex;flex-direction:column;justify-content:center;padding:0 86px;box-sizing:border-box}
 .rule{position:absolute;left:0;right:0;height:6px;background:#ff9f4a}
 .rule.top{top:0}.rule.bottom{bottom:0}
 .kicker{font-family:"DIN Alternate","DIN Condensed","Arial Narrow",sans-serif;
   font-size:26px;letter-spacing:.38em;text-transform:uppercase;color:#ff9f4a;margin-bottom:26px}
 h1{font-family:"DIN Alternate","DIN Condensed","Arial Narrow",sans-serif;
   font-size:96px;line-height:1.02;margin:0 0 26px;letter-spacing:-.01em}
 p{font-size:30px;line-height:1.45;color:#a7b0ba;margin:0;max-width:880px}
 .year{position:absolute;right:86px;bottom:56px;font-family:"DIN Alternate","DIN Condensed",sans-serif;
   font-size:150px;line-height:1;color:rgba(92,200,255,.16);letter-spacing:-.02em}
</style></head><body><div class="wrap">
 <div class="rule top"></div><div class="rule bottom"></div>
 <div class="kicker">Aperture Screening Initiative</div>
 <h1>Night of a<br>Thousand Pixels</h1>
 <p>Thirty-one volunteers. Two proposals each.<br>One film survives the evaluation.</p>
 <div class="year">2026</div>
</div></body></html>
