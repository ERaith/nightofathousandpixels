version: '3.8'

services:
  # Development database
  postgres:
    image: postgres:16-alpine
    container_name: nap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nightofpixels
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js app (development)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nap-app-dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nightofpixels
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-secret-change-me-in-production}
      NEXT_PUBLIC_SITE_NAME: Night of a Thousand Pixels
      ORIGIN: http://localhost:3000
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm prisma:dev && pnpm dev"

  # Next.js app (production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nap-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Night of a Thousand Pixels}
      ORIGIN: ${ORIGIN:-https://pixels.eraith.dev}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      NODE_ENV: production
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
